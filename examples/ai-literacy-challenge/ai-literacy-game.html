<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    :root{--pink:#ff4fd8;--purple:#7b5bff;--blue:#42d9ff;--gold:#ffd54a;--green:#2ee66f;--red:#ff5067;--glass:rgba(255,255,255,.15)}
    *{box-sizing:border-box} body{margin:0;font-family:'Fredoka',system-ui,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 20% 20%,#c455ff 0,#7f3eff 30%,#3c2c9f 60%,#1a1748 100%);overflow-x:hidden}

    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-120px)}}
    .wrap{max-width:980px;margin:0 auto;padding:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));border:2px solid rgba(255,255,255,.3);border-radius:24px;padding:22px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(20,0,60,.45)}
    .hidden{display:none}.title{font-size:clamp(34px,7vw,62px);text-align:center;margin:0;background:linear-gradient(90deg,#ff6ee8,#ffd466,#5af9ff,#ff6ee8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:250% 100%;animation:rainbow 4s linear infinite,pulse 1.7s ease-in-out infinite;text-shadow:0 0 30px rgba(255,255,255,.35)}
    @keyframes rainbow{to{background-position:250% 0}} @keyframes pulse{50%{filter:brightness(1.3)}}
    .subtitle{text-align:center;color:#fff5a6}.btn{position:relative;border:none;padding:14px 24px;border-radius:999px;font:700 18px Fredoka;cursor:pointer;color:#41170e;background:linear-gradient(180deg,#fff4a8,#ffc84f);box-shadow:0 8px 0 #df9f2d,0 10px 20px rgba(0,0,0,.3);transition:.15s transform}
    .btn:hover{transform:translateY(-2px) scale(1.03)} .btn:active{transform:translateY(4px) scale(.98);box-shadow:0 4px 0 #df9f2d}
    .btn:before{content:'';position:absolute;left:14px;right:14px;top:6px;height:35%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
    .hud{position:sticky;top:8px;z-index:9;display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px;margin-bottom:14px}
    .chip{background:var(--glass);border:2px solid rgba(255,255,255,.32);border-radius:16px;padding:8px 10px;text-align:center}
    .chip strong{display:block;font-size:1.25rem}.scale{animation:pop .3s ease} @keyframes pop{50%{transform:scale(1.25)}}
    .levelbar{grid-column:1/-1;background:rgba(0,0,0,.24);padding:8px;border-radius:14px}.bar{height:14px;border-radius:999px;background:#32286f;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#4cf0ff,#ff7de8,#ffe563)}
    .concept{margin:.5rem 0;color:#fff6b0;font-size:1.4rem}.script{min-height:80px;background:rgba(20,9,67,.45);border-left:5px solid #74dcff;border-radius:12px;padding:12px}
    .opts{display:grid;gap:12px;margin-top:12px}.opt{border:2px solid #ffffff73;border-radius:18px;padding:14px;text-align:left;color:#fff;background:linear-gradient(150deg,#7249ff,#ac5cff);cursor:pointer;font:600 16px Fredoka;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
    .opt:hover{filter:brightness(1.15);box-shadow:0 0 18px #ff84ff9a} .opt.ok{background:linear-gradient(140deg,#34f98f,#15b760)} .opt.bad{background:linear-gradient(140deg,#ff8298,#ff4f6e);animation:shake .35s}
    @keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
    .feedback{margin-top:10px;padding:10px;border-radius:12px;background:rgba(7,5,35,.45)}
    .float{position:fixed;z-index:15;font-weight:700;animation:up 1s ease forwards}@keyframes up{to{transform:translateY(-50px);opacity:0}}
    .toast{position:fixed;right:10px;top:10px;background:#fff;color:#4b1f69;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateX(120%);transition:.4s;z-index:20}.toast.show{transform:translateX(0)}
    .overlay{position:fixed;inset:0;background:rgba(24,9,64,.88);display:flex;align-items:center;justify-content:center;z-index:30;text-align:center}.celebrate{font-size:clamp(28px,6vw,56px)}
    .podium li{list-style:none;margin:8px 0;padding:8px;border-radius:10px;background:rgba(255,255,255,.13)}
  
    .hud-controls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .mini-btn{border:none;border-radius:999px;padding:8px 12px;font:700 14px Fredoka;cursor:pointer;background:linear-gradient(180deg,#dff7ff,#8fd6ff);color:#1f2459;box-shadow:0 4px 0 #58a9d4;transition:transform .2s}
    .mini-btn:hover{transform:translateY(-1px)} .mini-btn:active,.mini-btn.bounce{animation:bounce .35s}
    @keyframes bounce{30%{transform:scale(1.08)}60%{transform:scale(.96)}}
    .quiz-content{transition:opacity .35s,transform .35s}.quiz-content.fade{opacity:0;transform:translateY(8px)}
    .confetti,.sparkle{position:fixed;pointer-events:none;z-index:25;animation:fall 1.6s linear forwards}
    .sparkle{font-size:20px;animation:twinkle 1.2s ease-out forwards}
    @keyframes fall{to{transform:translateY(120px) rotate(420deg);opacity:0}}
    @keyframes twinkle{to{transform:translateY(-60px) scale(.2);opacity:0}}
    .high-contrast{background:#000!important;color:#fff!important}
    .high-contrast .card{background:#000;border-color:#fff}
    .high-contrast .opt{background:#111;border-color:#fff}
    .token-visual{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
    .token-visual svg{width:100%;height:auto;display:block}

  </style>

<body>
<div class="bgfx"></div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <section id="intro" class="card">
    <h1 class="title">A.I. LITERACY CHALLENGE</h1>
    <p class="subtitle">Prof. Dr. De Souza</p>
    <div style="text-align:center"><button class="btn" onclick="startGame()">Iniciar Desafio</button></div>
  </section>
  <section id="quiz" class="card hidden">
    <div class="hud">
      <div class="chip">💎<strong id="diamonds">0</strong></div>
      <div class="chip">🪙<strong id="coins">0</strong></div>
      <div class="chip">⭐<strong id="score">0</strong></div>
      <div class="chip">❤️<strong id="lives">3</strong></div>

      <div class="chip">Pergunta<strong id="qnum">1</strong></div>
      <div class="levelbar"><div class="bar"><div id="progress" class="fill"></div></div></div>
      <div class="hud-controls">
        <button class="mini-btn" id="musicToggle" onclick="toggleMusic()">🔊 Música</button>
        <button class="mini-btn" id="readBtn" onclick="readQuestion()">🔊 Ler pergunta</button>
        <button class="mini-btn" onclick="adjustFont(1)">A+</button>
        <button class="mini-btn" onclick="adjustFont(-1)">A-</button>
        <button class="mini-btn" id="contrastBtn" onclick="toggleContrast()">◐ Contraste</button>
      </div>
    </div>
    <div id="quizContent" class="quiz-content"><h2 class="concept" id="concept"></h2><div class="script" id="script"></div><div id="visualWrap"></div><div class="opts" id="opts"></div><div id="feedback" class="feedback hidden"></div></div>
  </section>
  <section id="between" class="card hidden" style="text-align:center"><h2>🎉 Nível concluído!</h2><p>Pontuação atual: <b id="betweenScore"></b></p><button class="btn" onclick="nextLevel()">Próximo Nível →</button></section>
  <section id="end" class="card hidden" style="text-align:center">
    <h2>Fim do desafio</h2><p>Pontuação final: <b id="final"></b>/14</p><p id="msg"></p>
    <div><input id="playerName" placeholder="Seu nome" style="padding:10px;border-radius:10px;border:none" maxlength="20"><button class="btn" onclick="submitScore()">Salvar pontuação</button></div>
    <h3>🌍 Leaderboard Global</h3><ul id="leaderboard" class="podium"></ul>
    <button class="btn" onclick="location.reload()">Jogar novamente</button>
  </section>
</div>
<script>
const levels=[
 {nome:'Nível 1 — Fundamentos',qs:[
  {concept:'LLM',script:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023), um LLM é uma rede neural que modela probabilidades de sequências linguísticas.',citation:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023)',exp:'LLMs não são bancos de verdades; eles estimam probabilidades de sequência.',options:[
   'A) Um banco de dados de verdades verificadas','B) Uma rede neural que modela probabilidades de sequências linguísticas','C) Um compilador de software','D) Um antivírus educacional'],correct:1},
  {concept:'Token',script:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023), quando uma entrada de texto é fornecida ao ChatGPT, ela é primeiro "tokenizada", ou seja, dividida em unidades menores chamadas tokens.',citation:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023)',visual:'tokenization',exp:'Token é a unidade mínima de processamento do LLM — cada palavra ou fragmento de palavra vira um token antes de ser processado.',options:['A) Dividida em unidades menores chamadas tokens','B) Traduzida diretamente para inglês','C) Armazenada em um banco de dados relacional','D) Convertida em imagens vetoriais'],correct:0},{concept:'Prompt-EDU',script:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023), o Prompt-EDU é um roteiro de prompt estruturado vinculado à taxonomia de Bloom para uso do ChatGPT em contextos do processo ensino-aprendizagem.',citation:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023)',exp:'O Prompt-EDU contém três elementos: finalidade da tarefa, contexto de aplicação e chave de comando específica, ancorando a generalizacão do LLM na taxonomia de Bloom.',options:['A) Um roteiro estruturado de prompts vinculado à taxonomia de Bloom para fins educacionais','B) Um antivírus para proteger arquivos educacionais','C) Uma plataforma de videoconferência para aulas online','D) Um banco de questões gerado automaticamente por IA'],correct:0},{concept:'Viés de Idioma',script:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023), o ChatGPT processa todas as entradas no idioma inglês, seu idioma nativo, inserindo uma dupla tradução no processamento de prompts feitos em outros idiomas.',citation:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023)',exp:'O viés de idioma ocorre porque o LLM faz uma tradução idioma→inglês na entrada e inglês→idioma na saída, o que pode gerar diferenças nas respostas em idiomas não-nativos.',options:['A) O LLM processa em inglês e traduz duplamente os prompts em outros idiomas','B) O ChatGPT responde sempre no idioma com mais usuários cadastrados','C) Os prompts são processados no idioma em que foram escritos, sem tradução','D) A IA ignora prompts em idiomas não-nativos e pede reformulação em inglês'],correct:0},{concept:'AUDI-GPTedu',script:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023), a rotina AUDI-GPTedu é uma sequência sistematizada de prompts aplicada no ChatGPT para auditar o conteúdo de arquivos de slides, identificando o foco de comunicação e o objetivo de aprendizagem via taxonomia de Bloom.',citation:'Segundo Souza, Ricieri, Barreto e Farias (CoBICET 2023)',exp:'A rotina AUDI-GPTedu tem três pilares: foco de comunicação dos materiais, identificação dos pontos de destaque e identificação do objetivo de aprendizagem, usando a taxonomia de Bloom como âncora.',options:['A) Uma rotina de prompts para auditar slides e identificar objetivos de aprendizagem pela taxonomia de Bloom','B) Um software de edição de vídeos educativos com IA','C) Um sistema de avaliação somativa para cursos de pós-graduação','D) Uma plataforma de gamificação para ensino fundamental'],correct:0}
 ]},
 {nome:'Nível 2 — Aplicações',qs:Array.from({length:5}).map((_,i)=>({concept:`Aplicações ${i+1}`,script:'Trecho do roteiro (não fornecido nesta solicitação).',citation:'Roteiro-base',exp:'Questão de espaço reservada para o texto exato do roteiro.',options:['A) Opção A','B) Opção B','C) Opção C','D) Opção D'],correct:0}))},
 {nome:'Nível 3 — Domínio Avançado',qs:Array.from({length:4}).map((_,i)=>({concept:`Domínio ${i+1}`,script:'Trecho do roteiro (não fornecido nesta solicitação).',citation:'Roteiro-base',exp:'Questão de espaço reservada para o texto exato do roteiro.',options:['A) Opção A','B) Opção B','C) Opção C','D) Opção D'],correct:0}))}
];
const workerURL='https://ai-literacy-leaderboard.mrdesouzaphd.workers.dev';
let li=0,qi=0,score=0,lives=3,typing=false,diamonds=0,coins=0,streak=0,noErrors=true;
const total=14,audio=new (window.AudioContext||window.webkitAudioContext)();
let fontScale=1,musicOn=true,contrastOn=false,currentQuestion=null,preferredVoice=null;
const musicGain=audio.createGain();musicGain.gain.value=.05;musicGain.connect(audio.destination);
function ambientPad(){if(!musicOn)return;const prog=[[261.63,329.63,392],[293.66,369.99,440],[329.63,415.3,493.88],[246.94,311.13,392]];prog.forEach((ch,step)=>ch.forEach(f=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(musicGain);const t=audio.currentTime+step*1.4;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.04,t+.6);g.gain.linearRampToValueAtTime(.0001,t+1.35);o.start(t);o.stop(t+1.4)}));setTimeout(ambientPad,5600)}
const tone=(f,t=.12,type='sine',when=0)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=.0001;o.connect(g);g.connect(audio.destination);const now=audio.currentTime+when;g.gain.exponentialRampToValueAtTime(.2,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+t);o.start(now);o.stop(now+t+.02)};
function sfx(kind){if(kind==='ok')[440,554,659].forEach((f,i)=>tone(f,.2,'triangle',i*.08));if(kind==='bad')tone(140,.35,'sawtooth');if(kind==='coin')[920,1100,1320].forEach((f,i)=>tone(f,.08,'square',i*.05));if(kind==='win')[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',i*.09));if(kind==='ach')[740,988,1318].forEach((f,i)=>tone(f,.1,'sine',i*.06));if(kind==='click')tone(460,.06,'sine');}
function startGame(){if(audio.state==='suspended')audio.resume();if(musicOn)ambientPad();sfx('click');intro.classList.add('hidden');quiz.classList.remove('hidden');render();}
function typeText(el,text,done){el.textContent='';let i=0;typing=true;const t=setInterval(()=>{el.textContent+=text[i++]||'';if(i>text.length){clearInterval(t);typing=false;done&&done()}},13)}
function pulse(id){const el=document.getElementById(id).parentElement;el.classList.remove('scale');void el.offsetWidth;el.classList.add('scale')}
function floatText(txt){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left='30px';d.style.top='80px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function achievement(msg){toast.textContent=msg;toast.classList.add('show');sfx('ach');setTimeout(()=>toast.classList.remove('show'),1800)}
function render(){quizContent.classList.add('fade');setTimeout(()=>quizContent.classList.remove('fade'),40);const q=levels[li].qs[qi];currentQuestion=q;levelLabel.textContent=`Nível ${li+1}`;qnum.textContent=`${qi+1}/${levels[li].qs.length}`;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('diamonds').textContent=diamonds;document.getElementById('coins').textContent=coins;progress.style.width=((li*5+qi+1)/total*100)+'%';concept.textContent=q.concept;feedback.classList.add('hidden');opts.innerHTML='';visualWrap.innerHTML=q.visual==='tokenization'?`<div class="token-visual" aria-label="Ilustração educativa de tokenização em LLM"><svg viewBox="0 0 980 430" role="img" aria-labelledby="tokenTitle tokenDesc"><title id="tokenTitle">Como a frase em português é tokenizada</title><desc id="tokenDesc">A frase ChatGPT ajuda estudantes é decomposta em tokens de palavra inteira, subpalavras e separadores, que são as unidades fundamentais processadas por modelos de linguagem.</desc><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2d236f"/><stop offset="100%" stop-color="#1a1647"/></linearGradient><linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#59f2ff"/><stop offset="100%" stop-color="#30c6ff"/></linearGradient><linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff95e9"/><stop offset="100%" stop-color="#ff67cc"/></linearGradient><linearGradient id="punctGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe082"/><stop offset="100%" stop-color="#ffc857"/></linearGradient><filter id="softGlow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8be7ff" flood-opacity="0.45"/></filter></defs><rect x="10" y="10" width="960" height="410" rx="22" fill="url(#bgGrad)" stroke="#9adfff" stroke-width="2"/><text x="36" y="52" fill="#fff8b6" font-size="30" font-family="Fredoka">Tokenização de uma frase em português</text><text x="36" y="82" fill="#d8f7ff" font-size="18" font-family="Fredoka">Modelos quebram texto em pedaços menores (tokens) antes de prever a próxima sequência.</text><rect x="36" y="102" width="908" height="62" rx="14" fill="#2a2d7a" stroke="#b5f0ff"/><text x="56" y="141" fill="#ffffff" font-size="30" font-family="Fredoka">"ChatGPT ajuda estudantes"</text><line x1="164" y1="164" x2="164" y2="208" stroke="#8ce7ff" stroke-width="2" stroke-dasharray="5 5"/><line x1="354" y1="164" x2="354" y2="208" stroke="#8ce7ff" stroke-width="2" stroke-dasharray="5 5"/><line x1="478" y1="164" x2="478" y2="208" stroke="#8ce7ff" stroke-width="2" stroke-dasharray="5 5"/><line x1="686" y1="164" x2="686" y2="208" stroke="#8ce7ff" stroke-width="2" stroke-dasharray="5 5"/><text x="36" y="210" fill="#fff8b6" font-size="22" font-family="Fredoka">Possível divisão em tokens (exemplo didático):</text><g filter="url(#softGlow)"><rect x="36" y="226" width="120" height="56" rx="14" fill="url(#wordGrad)"/><text x="72" y="262" fill="#0f1c48" font-size="28" font-family="Fredoka">Chat</text><rect x="170" y="226" width="82" height="56" rx="14" fill="url(#subGrad)"/><text x="194" y="262" fill="#3a0f38" font-size="28" font-family="Fredoka">GPT</text><rect x="266" y="226" width="70" height="56" rx="14" fill="url(#punctGrad)"/><text x="290" y="262" fill="#563700" font-size="30" font-family="Fredoka">▁</text><rect x="350" y="226" width="116" height="56" rx="14" fill="url(#wordGrad)"/><text x="387" y="262" fill="#0f1c48" font-size="28" font-family="Fredoka">ajuda</text><rect x="480" y="226" width="70" height="56" rx="14" fill="url(#punctGrad)"/><text x="504" y="262" fill="#563700" font-size="30" font-family="Fredoka">▁</text><rect x="564" y="226" width="128" height="56" rx="14" fill="url(#subGrad)"/><text x="589" y="262" fill="#3a0f38" font-size="28" font-family="Fredoka">estu</text><rect x="706" y="226" width="102" height="56" rx="14" fill="url(#subGrad)"/><text x="735" y="262" fill="#3a0f38" font-size="28" font-family="Fredoka">dantes</text></g><g><rect x="36" y="304" width="22" height="22" rx="6" fill="url(#wordGrad)"/><text x="66" y="321" fill="#dff9ff" font-size="17" font-family="Fredoka">Palavra inteira</text><rect x="236" y="304" width="22" height="22" rx="6" fill="url(#subGrad)"/><text x="266" y="321" fill="#ffdff6" font-size="17" font-family="Fredoka">Subpalavra / pedaço de palavra</text><rect x="566" y="304" width="22" height="22" rx="6" fill="url(#punctGrad)"/><text x="596" y="321" fill="#fff2cc" font-size="17" font-family="Fredoka">Separador (espaço/pontuação)</text></g><rect x="36" y="338" width="908" height="66" rx="12" fill="#1d1e57" stroke="#7fe5ff"/><text x="52" y="365" fill="#d8fff7" font-size="20" font-family="Fredoka">Tokens são as unidades fundamentais que o LLM realmente processa — não palavras “inteiras” por padrão.</text><text x="52" y="389" fill="#ffe6ff" font-size="18" font-family="Fredoka">Modelos diferentes (BPE, SentencePiece etc.) podem quebrar a mesma frase de formas distintas.</text></svg><p style="margin:.7rem 0 0;color:#dbfbff;font-size:1rem;line-height:1.4">Em IA generativa, <b>token</b> é cada unidade de texto convertida em números para o modelo calcular probabilidades. A tokenização importa porque o limite de contexto, custo e até qualidade da resposta dependem da quantidade e do tipo de tokens. Como cada modelo usa um tokenizador próprio, a mesma frase pode virar conjuntos de tokens diferentes.</p></div>`:'';typeText(script,q.script,()=>q.options.forEach((op,idx)=>{const b=document.createElement('button');b.className='opt';b.textContent=op;b.onclick=()=>answer(idx,b);opts.appendChild(b)}));}
function celebrate(){const o=document.createElement('div');o.className='overlay';o.innerHTML='<div><div class="celebrate">NÍVEL COMPLETO! ⭐⭐⭐</div><p>Parabéns!</p></div>';document.body.appendChild(o);victorySparkles();sfx('win');setTimeout(()=>o.remove(),1400)}
function answer(idx,btn){if(typing)return;sfx('click');const q=levels[li].qs[qi];[...document.querySelectorAll('.opt')].forEach(b=>b.disabled=true);const ok=idx===q.correct;if(ok){btn.classList.add('ok');score++;diamonds+=2;coins+=5;streak++;sfx('ok');sfx('coin');confettiBurst(22);floatText('+💎2 +🪙5');['score','diamonds','coins'].forEach(pulse);if(score===1)achievement('Primeira Resposta Certa! 🎉');if(streak===3)achievement('Sequência de 3! 🔥');}else{btn.classList.add('bad');lives--;streak=0;noErrors=false;sfx('bad');pulse('lives');document.querySelectorAll('.opt')[q.correct].classList.add('ok');}
feedback.classList.remove('hidden');feedback.innerHTML=`<b>${ok?'✅ Correto':'❌ Incorreto'}</b><br><small>Fonte: ${q.citation}</small><br>${q.exp}`;
setTimeout(()=>{if(lives<=0)return end();qi++;if(qi>=levels[li].qs.length){if(li<2){if(noErrors)achievement('Sem Erros! 💫');achievement('Mestre do Nível! 👑');celebrate();quiz.classList.add('hidden');between.classList.remove('hidden');betweenScore.textContent=score;}else end();}else render();},1200)}
function nextLevel(){sfx('click');between.classList.add('hidden');quiz.classList.remove('hidden');li++;qi=0;render();}
async function loadLeaderboard(){let data=[];try{const r=await fetch(workerURL+'/leaderboard');if(!r.ok)throw 0;data=(await r.json()).scores||[]}catch{data=JSON.parse(localStorage.getItem('aiLeader')||'[]').sort((a,b)=>b.score-a.score).slice(0,10)}leaderboard.innerHTML=data.map((s,i)=>`<li>${i===0?'👑':i===1?'🥈':i===2?'🥉':'🎖️'} ${i+1}. ${s.name} — ${s.score} pts (N${s.level})</li>`).join('')||'<li>Sem pontuações ainda.</li>'}
async function submitScore(){const name=(playerName.value||'Anônimo').trim().slice(0,20);const entry={name,score,level:li+1,timestamp:new Date().toISOString()};try{await fetch(workerURL+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});}catch{const arr=JSON.parse(localStorage.getItem('aiLeader')||'[]');arr.push(entry);localStorage.setItem('aiLeader',JSON.stringify(arr));}loadLeaderboard()}
function end(){quiz.classList.add('hidden');between.classList.add('hidden');endSec.classList.remove('hidden');final.textContent=score;msg.textContent=score>=12?'Excelente! Você domina a IA educacional.':score>=8?'Muito bem! Continue desenvolvendo seu letramento.':'Continue estudando — a jornada é sua maior conquista.';loadLeaderboard();}

function confettiBurst(n=16){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.textContent=['✨','🎉','💖','⭐'][Math.floor(Math.random()*4)];c.style.left=(20+Math.random()*60)+'vw';c.style.top=(40+Math.random()*20)+'vh';c.style.fontSize=(12+Math.random()*18)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),1600)}}
function victorySparkles(){for(let i=0;i<28;i++){const s=document.createElement('div');s.className='sparkle';s.textContent='✨';s.style.left=(10+Math.random()*80)+'vw';s.style.top=(20+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function toggleMusic(){musicOn=!musicOn;musicToggle.textContent=musicOn?'🔊 Música':'🔇 Música';if(!musicOn)musicGain.gain.value=0;else{musicGain.gain.value=.05;ambientPad();}}
function selectBestVoice(){if(!('speechSynthesis' in window))return null;const voices=speechSynthesis.getVoices();if(!voices.length)return null;const femaleHint=v=>/female|woman|mulher|feminina/i.test(v.name);const qualityHint=v=>/google|microsoft/i.test(v.name);const pick=(lang)=>voices.find(v=>v.lang===lang&&qualityHint(v)&&femaleHint(v))||voices.find(v=>v.lang===lang&&qualityHint(v))||voices.find(v=>v.lang===lang&&femaleHint(v))||voices.find(v=>v.lang===lang);return pick('pt-BR')||pick('pt-PT')||pick('en-US')||null;}
function readQuestion(){if(!('speechSynthesis' in window)||!currentQuestion)return;preferredVoice=preferredVoice||selectBestVoice();const u=new SpeechSynthesisUtterance(`${currentQuestion.concept}. ${currentQuestion.script}. Opções: ${currentQuestion.options.join('. ')}`);if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang;}else u.lang='pt-BR';u.rate=1.1;u.pitch=1.05;u.volume=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}
function adjustFont(delta){fontScale=Math.min(1.5,Math.max(.85,fontScale+delta*0.08));document.documentElement.style.fontSize=(fontScale*100)+'%';}
function toggleContrast(){contrastOn=!contrastOn;document.body.classList.toggle('high-contrast',contrastOn);contrastBtn.textContent=contrastOn?'◑ Contraste alto':'◐ Contraste';}

if('speechSynthesis' in window){selectBestVoice();speechSynthesis.onvoiceschanged=()=>{preferredVoice=selectBestVoice();};}

const intro=document.getElementById('intro'),quiz=document.getElementById('quiz'),between=document.getElementById('between'),script=document.getElementById('script'),opts=document.getElementById('opts'),concept=document.getElementById('concept'),feedback=document.getElementById('feedback'),betweenScore=document.getElementById('betweenScore'),toast=document.getElementById('toast'),progress=document.getElementById('progress'),endSec=document.getElementById('end'),quizContent=document.getElementById('quizContent'),visualWrap=document.getElementById('visualWrap'),musicToggle=document.getElementById('musicToggle'),contrastBtn=document.getElementById('contrastBtn');
</script>
</body></html>

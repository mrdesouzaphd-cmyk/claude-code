<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.I. Literacy Challenge</title>
  <style>
    :root{--c1:#00D9FF;--c2:#FF00FF;--c3:#FFD700;--ok:#1dd75f;--bad:#ff4d57;--bg:#0a0430}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#1a0033,#000428);color:#fff}
    .wrap{max-width:920px;margin:0 auto;padding:24px}.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:18px;padding:24px}
    .hidden{display:none}.title{font-size:clamp(28px,6vw,56px);font-weight:900;text-align:center;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.8s infinite}
    .subtitle{text-align:center;color:var(--c3);font-weight:700;margin:8px 0 20px}.btn{cursor:pointer;border:none;padding:14px 20px;border-radius:999px;font-weight:800;background:linear-gradient(90deg,var(--c3),var(--c2));color:#111}
    .hud{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.bar{flex:1;min-width:180px;height:12px;background:#1d1d3d;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0}
    .concept{color:var(--c3);font-weight:800}.script{min-height:84px;line-height:1.5;margin:12px 0;padding:12px;border-left:4px solid var(--c1);background:rgba(0,0,0,.25)}
    .opts{display:grid;gap:10px}.opt{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:#120c3c;color:#fff;text-align:left;cursor:pointer}
    .opt:disabled{opacity:.75;cursor:not-allowed}.opt.ok{background:rgba(29,215,95,.2);border-color:var(--ok)}.opt.bad{background:rgba(255,77,87,.2);border-color:var(--bad)}
    .feedback{margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,.3)}
    @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
  </style>
</head>
<body>
<div class="wrap">
  <section id="intro" class="card">
    <h1 class="title">A.I. LITERACY CHALLENGE</h1>
    <p class="subtitle">Prof. Dr. De Souza</p>
    <div style="text-align:center"><button class="btn" onclick="startGame()">Iniciar Desafio</button></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="hud">
      <div id="levelLabel"></div><div>Pontos: <b id="score">0</b></div><div>❤️ <span id="lives">3</span></div>
      <div class="bar"><div id="progress" class="fill"></div></div>
    </div>
    <h2 class="concept" id="concept"></h2>
    <div class="script" id="script"></div>
    <div class="opts" id="opts"></div>
    <div id="feedback" class="feedback hidden"></div>
  </section>

  <section id="between" class="card hidden" style="text-align:center">
    <h2>🎉 Nível concluído!</h2>
    <p>Pontuação atual: <b id="betweenScore"></b></p>
    <button class="btn" onclick="nextLevel()">Próximo Nível →</button>
  </section>

  <section id="end" class="card hidden" style="text-align:center">
    <h2>Fim do desafio</h2>
    <p>Pontuação final: <b id="final"></b>/14</p>
    <p id="msg"></p>
    <button class="btn" onclick="location.reload()">Jogar novamente</button>
  </section>
</div>
<script>
const levels=[
 {nome:'Nível 1 — Fundamentos',qs:[
  {concept:'LLM',script:'Segundo De Souza, Rissieri, Ba-rre-to e FARIAS (CoBICET 2023), um LLM é uma rede neural que modela probabilidades de sequências linguísticas.',citation:'CoBICET 2023',exp:'LLMs não são bancos de verdades; eles estimam probabilidades de sequência.',options:[
   'A) Um banco de dados de verdades verificadas','B) Uma rede neural que modela probabilidades de sequências linguísticas','C) Um compilador de software','D) Um antivírus educacional'],correct:1},
  ...Array.from({length:4}).map((_,i)=>({concept:`Fundamentos ${i+2}`,script:'Trecho do roteiro (não fornecido nesta solicitação).',citation:'Roteiro-base',exp:'Questão de espaço reservada para o texto exato do roteiro.',options:['A) Opção A','B) Opção B','C) Opção C','D) Opção D'],correct:0}))
 ]},
 {nome:'Nível 2 — Aplicações',qs:Array.from({length:5}).map((_,i)=>({concept:`Aplicações ${i+1}`,script:'Trecho do roteiro (não fornecido nesta solicitação).',citation:'Roteiro-base',exp:'Questão de espaço reservada para o texto exato do roteiro.',options:['A) Opção A','B) Opção B','C) Opção C','D) Opção D'],correct:0}))},
 {nome:'Nível 3 — Domínio Avançado',qs:Array.from({length:4}).map((_,i)=>({concept:`Domínio ${i+1}`,script:'Trecho do roteiro (não fornecido nesta solicitação).',citation:'Roteiro-base',exp:'Questão de espaço reservada para o texto exato do roteiro.',options:['A) Opção A','B) Opção B','C) Opção C','D) Opção D'],correct:0}))}
];
let li=0,qi=0,score=0,lives=3,typing=false;
const total=14;
function startGame(){intro.classList.add('hidden');quiz.classList.remove('hidden');render();}
function typeText(el,text,done){el.textContent='';let i=0;typing=true;const t=setInterval(()=>{el.textContent+=text[i++]||'';if(i>text.length){clearInterval(t);typing=false;done&&done()}},18)}
function render(){const q=levels[li].qs[qi];levelLabel.textContent=levels[li].nome;scoreEl=score;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('progress').style.width=((li*5+qi+1)/total*100)+'%';concept.textContent=q.concept;feedback.classList.add('hidden');opts.innerHTML='';typeText(script,q.script,()=>q.options.forEach((op,idx)=>{const b=document.createElement('button');b.className='opt';b.textContent=op;b.onclick=()=>answer(idx,b);opts.appendChild(b)}));}
function answer(idx,btn){if(typing)return;const q=levels[li].qs[qi];[...document.querySelectorAll('.opt')].forEach(b=>b.disabled=true);const ok=idx===q.correct;if(ok){btn.classList.add('ok');score++;}else{btn.classList.add('bad');lives--;document.querySelectorAll('.opt')[q.correct].classList.add('ok');}
feedback.classList.remove('hidden');feedback.innerHTML=`<b>${ok?'✅ Correto':'❌ Incorreto'}</b><br><small>Fonte: ${q.citation}</small><br>${q.exp}`;
setTimeout(()=>{if(lives<=0)return end();qi++;if(qi>=levels[li].qs.length){if(li<2){quiz.classList.add('hidden');between.classList.remove('hidden');betweenScore.textContent=score;}else end();}else render();},1200)}
function nextLevel(){between.classList.add('hidden');quiz.classList.remove('hidden');li++;qi=0;render();}
function end(){quiz.classList.add('hidden');between.classList.add('hidden');endSec=document.getElementById('end');endSec.classList.remove('hidden');document.getElementById('final').textContent=score;document.getElementById('msg').textContent=score>=12?'Excelente! Você domina a IA educacional.':score>=8?'Muito bem! Continue desenvolvendo seu letramento.':'Continue estudando — a jornada é sua maior conquista.';}
const intro=document.getElementById('intro'),quiz=document.getElementById('quiz'),between=document.getElementById('between'),script=document.getElementById('script'),opts=document.getElementById('opts'),concept=document.getElementById('concept'),feedback=document.getElementById('feedback'),levelLabel=document.getElementById('levelLabel'),betweenScore=document.getElementById('betweenScore');
</script>
</body>
</html>

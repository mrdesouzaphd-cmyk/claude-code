<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science of the Artificial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .visual {
            position: absolute;
            width: 300px;
            height: 300px;
            opacity: 0;
            animation: visualMorph 3s ease-in-out 3s forwards;
        }
        .blueprint {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, transparent 24%, rgba(0, 217, 255, 0.3) 25%, rgba(0, 217, 255, 0.3) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.3) 75%, rgba(0, 217, 255, 0.3) 76%, transparent 77%, transparent),
                        linear-gradient(90deg, transparent 24%, rgba(0, 217, 255, 0.3) 25%, rgba(0, 217, 255, 0.3) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.3) 75%, rgba(0, 217, 255, 0.3) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            border: 3px solid #00D9FF;
            border-radius: 50%;
            transform: scale(1);
            opacity: 1;
            animation: blueprintToAI 3s ease-in-out 3s forwards;
        }
        .brain-icon {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 150px;
            opacity: 0;
            animation: brainAppear 1s ease-out 4.5s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 70%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes visualMorph {
            0% { opacity: 1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes blueprintToAI {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.5; transform: scale(1.2) rotate(180deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(360deg); }
        }
        @keyframes brainAppear {
            0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="visual">
            <div class="blueprint"></div>
            <div class="brain-icon">🧠</div>
        </div>
        <p class="key-message" id="keyMessage"></p>
    </div>
    <div class="controls">
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="restartVideo()">🔄 Restart</button>
    </div>
    <script>
        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Language-specific content
        const content = {
            en: {
                title: 'SCIENCE OF THE ARTIFICIAL',
                subtitle: 'Engineering Intelligence',
                keyMessage: 'AI = Engineering Intelligent Systems'
            },
            pt: {
                title: 'CIENCIA DO ARTIFICIAL',
                subtitle: 'Engenharia da Inteligencia',
                keyMessage: 'IA = Engenharia de Sistemas Inteligentes'
            }
        };

        // Set content based on language
        document.getElementById('title').textContent = content[lang].title;
        document.getElementById('subtitle').textContent = content[lang].subtitle;
        document.getElementById('keyMessage').textContent = content[lang].keyMessage;

        // Audio narration
        const audio = new Audio(`audio/level1-01-${lang}.mp3`);
        let isPaused = false;
        let animationStartTime = null;

        // Control functions
        function playVideo() {
            isPaused = false;
            audio.play().catch(err => console.log('Audio playback failed:', err));
            if (!animationStartTime) {
                animationStartTime = Date.now();
            }
        }

        function pauseVideo() {
            isPaused = true;
            audio.pause();
        }

        function restartVideo() {
            location.reload();
        }

        // Start narration after 500ms delay
        setTimeout(() => {
            playVideo();
        }, 500);

        // Create particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>

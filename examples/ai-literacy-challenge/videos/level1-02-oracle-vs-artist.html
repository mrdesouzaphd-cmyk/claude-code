<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle vs Artist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .split-container {
            position: absolute;
            width: 600px;
            height: 300px;
            display: flex;
            gap: 60px;
            opacity: 0;
            animation: splitFade 1s ease-out 3s forwards;
        }
        .ai-type {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px currentColor);
            animation: iconPulse 2s ease-in-out infinite;
        }
        .oracle .icon { color: #00D9FF; animation-delay: 0s; }
        .artist .icon { color: #FF00FF; animation-delay: 0.5s; }
        .label {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
        }
        .oracle .label { color: #00D9FF; }
        .artist .label { color: #FF00FF; }
        .description {
            font-size: 16px;
            font-weight: 600;
            color: #FFD700;
            text-align: center;
        }
        .key-message {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes splitFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px currentColor); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px currentColor); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="split-container">
            <div class="ai-type oracle">
                <div class="icon">🔮</div>
                <div class="label" id="oracleLabel"></div>
                <div class="description" id="oracleDesc"></div>
            </div>
            <div class="ai-type artist">
                <div class="icon">🎨</div>
                <div class="label" id="artistLabel"></div>
                <div class="description" id="artistDesc"></div>
            </div>
        </div>
        <p class="key-message" id="keyMessage"></p>
    </div>
    <div class="controls">
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="restartVideo()">🔄 Restart</button>
    </div>
    <script>
        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Language-specific content
        const content = {
            en: {
                title: 'PREDICTIVE vs GENERATIVE',
                subtitle: 'Two Approaches to AI',
                oracleLabel: 'ORACLE',
                oracleDesc: 'Predicts next',
                artistLabel: 'ARTIST',
                artistDesc: 'Creates new',
                keyMessage: 'Two sides of AI intelligence'
            },
            pt: {
                title: 'PREDITIVA vs GERATIVA',
                subtitle: 'Duas Abordagens de IA',
                oracleLabel: 'ORACULO',
                oracleDesc: 'Preve o proximo',
                artistLabel: 'ARTISTA',
                artistDesc: 'Cria o novo',
                keyMessage: 'Dois lados da inteligencia artificial'
            }
        };

        // Set content based on language
        document.getElementById('title').textContent = content[lang].title;
        document.getElementById('subtitle').textContent = content[lang].subtitle;
        document.getElementById('oracleLabel').textContent = content[lang].oracleLabel;
        document.getElementById('oracleDesc').textContent = content[lang].oracleDesc;
        document.getElementById('artistLabel').textContent = content[lang].artistLabel;
        document.getElementById('artistDesc').textContent = content[lang].artistDesc;
        document.getElementById('keyMessage').textContent = content[lang].keyMessage;

        // Audio narration
        const audio = new Audio(`audio/level1-02-${lang}.mp3`);
        let isPaused = false;
        let animationStartTime = null;

        // Control functions
        function playVideo() {
            isPaused = false;
            audio.play().catch(err => console.log('Audio playback failed:', err));
            if (!animationStartTime) {
                animationStartTime = Date.now();
            }
        }

        function pauseVideo() {
            isPaused = true;
            audio.pause();
        }

        function restartVideo() {
            location.reload();
        }

        // Start narration after 500ms delay
        setTimeout(() => {
            playVideo();
        }, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>

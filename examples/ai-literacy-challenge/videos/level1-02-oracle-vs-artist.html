<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle vs Artist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .split-container {
            position: absolute;
            width: 600px;
            height: 300px;
            display: flex;
            gap: 60px;
            opacity: 0;
            animation: splitFade 1s ease-out 3s forwards;
        }
        .ai-type {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px currentColor);
            animation: iconPulse 2s ease-in-out infinite;
        }
        .oracle .icon { color: #00D9FF; animation-delay: 0s; }
        .artist .icon { color: #FF00FF; animation-delay: 0.5s; }
        .label {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
        }
        .oracle .label { color: #00D9FF; }
        .artist .label { color: #FF00FF; }
        .description {
            font-size: 16px;
            font-weight: 600;
            color: #FFD700;
            text-align: center;
        }
        .key-message {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes splitFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px currentColor); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px currentColor); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">PREDICTIVE vs GENERATIVE</h1>
        <p class="subtitle">Preditiva vs Gerativa</p>
        <div class="split-container">
            <div class="ai-type oracle">
                <div class="icon">🔮</div>
                <div class="label">ORACLE</div>
                <div class="description">Predicts next</div>
            </div>
            <div class="ai-type artist">
                <div class="icon">🎨</div>
                <div class="label">ARTIST</div>
                <div class="description">Creates new</div>
            </div>
        </div>
        <p class="key-message">Two sides of AI intelligence</p>
    </div>
    <script>
        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Audio narration
        const audio = new Audio(`audio/level1-02-${lang}.mp3`);
        
        // Start narration after 500ms delay
        setTimeout(() => {
            audio.play().catch(err => console.log('Audio playback failed:', err));
        }, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

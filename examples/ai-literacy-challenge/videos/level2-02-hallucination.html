<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallucination</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .noise-container {
            position: absolute;
            width: 400px;
            height: 200px;
            opacity: 0;
            animation: noiseFade 1s ease-out 3s forwards;
        }
        .pattern-wave {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #FF00FF, #00D9FF);
            border-radius: 2px;
            opacity: 0;
            animation: waveSlide 0.5s ease-out forwards;
        }
        .pattern-wave:nth-child(1) { top: 30%; animation-delay: 3.5s; }
        .pattern-wave:nth-child(2) { top: 50%; animation-delay: 4s; }
        .pattern-wave:nth-child(3) { top: 70%; animation-delay: 4.5s; }
        .anchor {
            position: absolute;
            bottom: 20%;
            font-size: 60px;
            opacity: 0;
            filter: grayscale(1);
            animation: anchorDrop 1s ease-out 5s forwards;
        }
        .cross {
            position: absolute;
            bottom: 20%;
            right: 30%;
            font-size: 80px;
            color: #FF00FF;
            opacity: 0;
            animation: crossAppear 0.5s ease-out 5.5s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes noiseFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes waveSlide {
            0% { opacity: 0; transform: scaleX(0); }
            100% { opacity: 1; transform: scaleX(1); }
        }
        @keyframes anchorDrop {
            0% { opacity: 0; transform: translateY(-50px); filter: grayscale(1); }
            100% { opacity: 1; transform: translateY(0); filter: grayscale(1); }
        }
        @keyframes crossAppear {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(45deg); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">HALLUCINATION</h1>
        <p class="subtitle">Alucinação</p>
        <div class="noise-container">
            <div class="pattern-wave"></div>
            <div class="pattern-wave"></div>
            <div class="pattern-wave"></div>
        </div>
        <div class="anchor">⚓</div>
        <div class="cross">✕</div>
        <p class="key-message">Pattern without factual anchoring</p>
    </div>
    <script>
        // Narration texts
        const narration = {
            en: "Hallucination is epistemic noise - when AI generates plausible patterns without factual grounding.",
            pt: "Alucinação é ruído epistêmico - quando a IA gera padrões plausíveis sem ancoragem factual."
        };

        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Text-to-speech narration
        function speak() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(narration[lang]);
                utterance.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // Start narration after 500ms delay
        setTimeout(speak, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

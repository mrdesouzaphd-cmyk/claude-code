<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .sentence {
            position: absolute;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            opacity: 0;
            animation: sentenceFade 1s ease-out 3s forwards;
        }
        .token-blocks {
            position: absolute;
            display: flex;
            gap: 10px;
            opacity: 0;
            animation: blocksFade 1s ease-out 4s forwards;
        }
        .token-block {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 900;
            opacity: 0;
            border: 3px solid;
            animation: tokenPop 0.4s ease-out forwards;
        }
        .token-block:nth-child(1) { border-color: #00D9FF; color: #00D9FF; animation-delay: 4.5s; }
        .token-block:nth-child(2) { border-color: #FF00FF; color: #FF00FF; animation-delay: 4.8s; }
        .token-block:nth-child(3) { border-color: #FFD700; color: #FFD700; animation-delay: 5.1s; }
        .token-block:nth-child(4) { border-color: #00D9FF; color: #00D9FF; animation-delay: 5.4s; }
        .formula {
            position: absolute;
            bottom: 25%;
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
            opacity: 0;
            animation: formulaFade 1s ease-out 5.5s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes sentenceFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes blocksFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes tokenPop {
            0% { opacity: 0; transform: scale(0); }
            50% { transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes formulaFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="sentence" id="sentence"></div>
        <div class="token-blocks" id="tokenBlocks">
            <div class="token-block" id="token1"></div>
            <div class="token-block" id="token2"></div>
            <div class="token-block" id="token3"></div>
            <div class="token-block" id="token4"></div>
        </div>
        <div class="formula" id="formula"></div>
        <p class="key-message" id="keyMessage"></p>
    </div>
    <div class="controls">
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="restartVideo()">🔄 Restart</button>
    </div>
    <script>
        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Language-specific content (NO accents in Portuguese)
        const content = {
            en: {
                title: 'TOKENS',
                subtitle: 'Language Building Blocks',
                sentence: '"AI is amazing!"',
                token1: 'AI',
                token2: 'is',
                token3: 'amaz',
                token4: 'ing!',
                formula: '1 token ≈ 0.75 words',
                keyMessage: 'Fundamental unit of language'
            },
            pt: {
                title: 'TOKENS',
                subtitle: 'Blocos de Linguagem',
                sentence: '"IA e incrivel!"',
                token1: 'IA',
                token2: 'e',
                token3: 'incri',
                token4: 'vel!',
                formula: '1 token ≈ 0.75 palavras',
                keyMessage: 'Unidade fundamental da linguagem'
            }
        };

        // Set content based on language
        document.getElementById('title').textContent = content[lang].title;
        document.getElementById('subtitle').textContent = content[lang].subtitle;
        document.getElementById('sentence').textContent = content[lang].sentence;
        document.getElementById('token1').textContent = content[lang].token1;
        document.getElementById('token2').textContent = content[lang].token2;
        document.getElementById('token3').textContent = content[lang].token3;
        document.getElementById('token4').textContent = content[lang].token4;
        document.getElementById('formula').textContent = content[lang].formula;
        document.getElementById('keyMessage').textContent = content[lang].keyMessage;


        // Language-specific content (NO accents in Portuguese)
        const content = {
            en: {'title': 'TOKENS', 'subtitle': 'Language Building Blocks', 'sentence': '"AI is amazing!"', 'token1': 'AI', 'token2': 'is', 'token3': 'amaz', 'token4': 'ing!', 'formula': '1 token ≈ 0.75 words', 'keyMessage': 'Fundamental unit of language'},
            pt: {'title': 'TOKENS', 'subtitle': 'Blocos de Construcao da Linguagem', 'sentence': '"IA e incrivel!"', 'token1': 'IA', 'token2': 'e', 'token3': 'incri', 'token4': 'vel!', 'formula': '1 token ≈ 0.75 palavras', 'keyMessage': 'Unidade fundamental da linguagem'}
        };

        // Set content based on language
        if (document.getElementById('title')) document.getElementById('title').textContent = content[lang].title;
        if (document.getElementById('subtitle')) document.getElementById('subtitle').textContent = content[lang].subtitle;
        if (document.getElementById('sentence')) document.getElementById('sentence').textContent = content[lang].sentence;
        if (document.getElementById('token1')) document.getElementById('token1').textContent = content[lang].token1;
        if (document.getElementById('token2')) document.getElementById('token2').textContent = content[lang].token2;
        if (document.getElementById('token3')) document.getElementById('token3').textContent = content[lang].token3;
        if (document.getElementById('token4')) document.getElementById('token4').textContent = content[lang].token4;
        if (document.getElementById('formula')) document.getElementById('formula').textContent = content[lang].formula;
        if (document.getElementById('keyMessage')) document.getElementById('keyMessage').textContent = content[lang].keyMessage;

        // Audio narration
        const audio = new Audio(`audio/level2-03-${lang}.mp3`);
        let isPaused = false;
        let animationStartTime = null;

        // Control functions
        function playVideo() {
            isPaused = false;
            audio.play().catch(err => console.log('Audio playback failed:', err));
            if (!animationStartTime) {
                animationStartTime = Date.now();
            }
        }

        function pauseVideo() {
            isPaused = true;
            audio.pause();
        }

        function restartVideo() {
            location.reload();
        }

        // Start narration after 500ms delay
        setTimeout(() => {
            playVideo();
        }, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>

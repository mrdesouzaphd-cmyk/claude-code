<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Window</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .window {
            position: absolute;
            width: 500px;
            height: 250px;
            border: 4px solid #00D9FF;
            border-radius: 20px;
            background: rgba(0, 217, 255, 0.1);
            opacity: 0;
            animation: windowAppear 1s ease-out 3s forwards;
            overflow: hidden;
        }
        .memory-items {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }
        .memory-item {
            padding: 10px 15px;
            background: rgba(255, 0, 255, 0.3);
            border-left: 4px solid #FF00FF;
            border-radius: 6px;
            font-size: 16px;
            color: #fff;
            opacity: 0;
            animation: itemSlide 0.5s ease-out forwards;
        }
        .memory-item:nth-child(1) { animation-delay: 3.5s; }
        .memory-item:nth-child(2) { animation-delay: 4s; }
        .memory-item:nth-child(3) { animation-delay: 4.5s; }
        .memory-item:nth-child(4) { animation-delay: 5s; opacity: 0.5; }
        .fade-indicator {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(0, 4, 40, 0.9));
        }
        .key-message {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes windowAppear {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes itemSlide {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">CONTEXT WINDOW</h1>
        <p class="subtitle">Janela de Contexto</p>
        <div class="window">
            <div class="memory-items">
                <div class="memory-item">Recent message 1...</div>
                <div class="memory-item">Recent message 2...</div>
                <div class="memory-item">Recent message 3...</div>
                <div class="memory-item">Old messages fade...</div>
            </div>
            <div class="fade-indicator"></div>
        </div>
        <p class="key-message">Short-term memory of AI</p>
    </div>
    <script>
        // Narration texts
        const narration = {
            en: "The context window is AI's short-term memory - beyond this limit, it forgets earlier content.",
            pt: "A janela de contexto é a memória de curto prazo da IA - além desse limite, ela esquece o conteúdo anterior."
        };

        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Text-to-speech narration
        function speak() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(narration[lang]);
                utterance.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // Start narration after 500ms delay
        setTimeout(speak, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

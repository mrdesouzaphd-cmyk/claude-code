<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain of Thought</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .chain {
            position: absolute;
            width: 550px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            animation: chainFade 1s ease-out 3s forwards;
        }
        .link {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: linkAppear 0.5s ease-out forwards;
        }
        .link:nth-child(1) { border-color: #00D9FF; color: #00D9FF; animation-delay: 3.5s; }
        .link:nth-child(3) { border-color: #FF00FF; color: #FF00FF; animation-delay: 4.5s; }
        .link:nth-child(5) { border-color: #FFD700; color: #FFD700; animation-delay: 5.5s; }
        .connector {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #00D9FF, #FF00FF);
            opacity: 0;
            animation: connectorGrow 0.5s ease-out forwards;
        }
        .connector:nth-child(2) { animation-delay: 4s; }
        .connector:nth-child(4) { animation-delay: 5s; }
        .thought-bubble {
            position: absolute;
            bottom: 20%;
            padding: 15px 25px;
            background: rgba(255, 0, 255, 0.2);
            border: 3px solid #FF00FF;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #FF00FF;
            opacity: 0;
            animation: bubblePop 0.5s ease-out 6s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6.5s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes chainFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes linkAppear {
            0% { opacity: 0; transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 20px currentColor; }
        }
        @keyframes connectorGrow {
            0% { opacity: 0; transform: scaleX(0); }
            100% { opacity: 1; transform: scaleX(1); }
        }
        @keyframes bubblePop {
            0% { opacity: 0; transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">CHAIN OF THOUGHT</h1>
        <p class="subtitle">Cadeia de Pensamento</p>
        <div class="chain">
            <div class="link">1</div>
            <div class="connector"></div>
            <div class="link">2</div>
            <div class="connector"></div>
            <div class="link">3</div>
        </div>
        <div class="thought-bubble">Let me think step by step...</div>
        <p class="key-message">AI shows reasoning process</p>
    </div>
    <script>
        // Narration texts
        const narration = {
            en: "Chain of Thought makes AI show its reasoning step-by-step before the final answer.",
            pt: "Cadeia de Pensamento faz a IA mostrar seu raciocínio passo-a-passo antes da resposta final."
        };

        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Text-to-speech narration
        function speak() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(narration[lang]);
                utterance.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // Start narration after 500ms delay
        setTimeout(speak, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

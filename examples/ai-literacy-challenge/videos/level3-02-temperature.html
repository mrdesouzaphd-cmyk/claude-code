<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .thermometer {
            position: absolute;
            width: 80px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            border: 4px solid #00D9FF;
            opacity: 0;
            animation: thermFade 1s ease-out 3s forwards;
            overflow: hidden;
        }
        .mercury {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0;
            background: linear-gradient(to top, #00D9FF, #FF00FF, #FFD700);
            animation: mercuryRise 2s ease-out 3.5s forwards;
        }
        .temp-labels {
            position: absolute;
            right: -180px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 0;
        }
        .temp-label {
            font-size: 18px;
            font-weight: 900;
            opacity: 0;
            animation: labelFade 0.5s ease-out forwards;
        }
        .temp-label.high { color: #FFD700; animation-delay: 4s; }
        .temp-label.low { color: #00D9FF; animation-delay: 5s; }
        .spectrum {
            position: absolute;
            bottom: 20%;
            width: 500px;
            display: flex;
            justify-content: space-between;
            opacity: 0;
            animation: spectrumFade 1s ease-out 5.5s forwards;
        }
        .spectrum-side {
            text-align: center;
        }
        .spectrum-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .spectrum-label {
            font-size: 20px;
            font-weight: 900;
        }
        .spectrum-side:first-child .spectrum-label { color: #00D9FF; }
        .spectrum-side:last-child .spectrum-label { color: #FF00FF; }
        .key-message {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes thermFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes mercuryRise {
            0% { height: 0; }
            100% { height: 80%; }
        }
        @keyframes labelFade {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes spectrumFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">TEMPERATURE</h1>
        <p class="subtitle">Temperatura</p>
        <div class="thermometer">
            <div class="mercury"></div>
            <div class="temp-labels">
                <div class="temp-label high">HIGH = Creative 🎨</div>
                <div class="temp-label low">LOW = Factual 📊</div>
            </div>
        </div>
        <div class="spectrum">
            <div class="spectrum-side">
                <div class="spectrum-icon">❄️</div>
                <div class="spectrum-label">Precise</div>
            </div>
            <div class="spectrum-side">
                <div class="spectrum-icon">🔥</div>
                <div class="spectrum-label">Imaginative</div>
            </div>
        </div>
        <p class="key-message">Randomness control parameter</p>
    </div>
    <script>
        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Audio narration
        const audio = new Audio(`audio/level3-02-${lang}.mp3`);
        
        // Start narration after 500ms delay
        setTimeout(() => {
            audio.play().catch(err => console.log('Audio playback failed:', err));
        }, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epistemic Agency</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .verification-flow {
            position: absolute;
            width: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            opacity: 0;
            animation: flowFade 1s ease-out 3s forwards;
        }
        .human {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            animation: humanAppear 0.5s ease-out 3.5s forwards;
        }
        .human-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px #FFD700);
        }
        .human-label {
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
        }
        .verify-icon {
            font-size: 60px;
            opacity: 0;
            animation: verifyPulse 1s ease-in-out 4.5s infinite;
        }
        .ai-output {
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            animation: outputAppear 0.5s ease-out 4s forwards;
        }
        .output-line {
            padding: 10px 20px;
            background: rgba(0, 217, 255, 0.2);
            border-left: 4px solid #00D9FF;
            border-radius: 6px;
            font-size: 16px;
            color: #00D9FF;
            font-weight: 700;
        }
        .shield {
            position: absolute;
            bottom: 20%;
            font-size: 70px;
            opacity: 0;
            animation: shieldAppear 0.5s ease-out 5.5s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes flowFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes humanAppear {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes verifyPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes outputAppear {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes shieldAppear {
            0% { opacity: 0; transform: scale(0) rotate(-45deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">EPISTEMIC AGENCY</h1>
        <p class="subtitle">Agência Epistêmica</p>
        <div class="verification-flow">
            <div class="human">
                <div class="human-icon">👤</div>
                <div class="human-label">VERIFY</div>
            </div>
            <div class="verify-icon">✓</div>
            <div class="ai-output">
                <div class="output-line">AI Output</div>
                <div class="output-line">Needs Check</div>
            </div>
        </div>
        <div class="shield">🛡️</div>
        <p class="key-message">Human responsibility to verify truth</p>
    </div>
    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

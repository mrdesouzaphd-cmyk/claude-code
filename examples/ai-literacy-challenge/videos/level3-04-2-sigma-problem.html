<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Sigma Problem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .comparison {
            position: absolute;
            width: 600px;
            display: flex;
            justify-content: space-around;
            opacity: 0;
            animation: compFade 1s ease-out 3s forwards;
        }
        .method {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .method-icon {
            font-size: 70px;
            opacity: 0;
            animation: iconBounce 0.5s ease-out forwards;
        }
        .classroom .method-icon { animation-delay: 3.5s; }
        .tutoring .method-icon { animation-delay: 4.5s; }
        .method-label {
            font-size: 20px;
            font-weight: 900;
            text-align: center;
        }
        .classroom .method-label { color: #00D9FF; }
        .tutoring .method-label { color: #FFD700; }
        .bars {
            position: absolute;
            bottom: 22%;
            width: 600px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            opacity: 0;
            animation: barsFade 1s ease-out 5s forwards;
        }
        .bar {
            width: 100px;
            background: linear-gradient(to top, #00D9FF, #FF00FF);
            border-radius: 8px 8px 0 0;
            animation: barGrow 1s ease-out forwards;
        }
        .bar.small { height: 0; animation-delay: 5.5s; }
        .bar.large { height: 0; background: linear-gradient(to top, #FFD700, #FF00FF); animation-delay: 6s; }
        .sigma {
            position: absolute;
            bottom: 15%;
            font-size: 60px;
            color: #FFD700;
            opacity: 0;
            animation: sigmaAppear 0.5s ease-out 6.5s forwards;
        }
        .key-message {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6.5s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes compFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes iconBounce {
            0% { opacity: 0; transform: translateY(-30px); }
            50% { transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes barsFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes barGrow {
            0% { height: 0; }
            100% { height: var(--h); }
        }
        @keyframes sigmaAppear {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="comparison">
            <div class="method classroom">
                <div class="method-icon">🏫</div>
                <div class="method-label"><span id="label1"></span><br><span id="label1b"></span></div>
            </div>
            <div class="method tutoring">
                <div class="method-icon">👨‍🏫</div>
                <div class="method-label"><span id="label2"></span><br><span id="label2b"></span></div>
            </div>
        </div>
        <div class="bars">
            <div class="bar small" style="--h: 80px;"></div>
            <div class="bar large" style="--h: 180px;"></div>
        </div>
        <div class="sigma">+2σ</div>
        <p class="key-message" id="keyMessage"></p>
    </div>
        <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        const content = {
            en: {title: '2 SIGMA PROBLEM', subtitle: 'Personalized Learning', keyMessage: '1:1 tutoring achieves 2σ improvement'},
            pt: {title: 'PROBLEMA 2 SIGMA', subtitle: 'Aprendizado Personalizado', keyMessage: 'Tutoria 1:1 alcanca melhora de 2σ'}
        };

        document.getElementById('title').textContent = content[lang].title;
        document.getElementById('subtitle').textContent = content[lang].subtitle;
        document.getElementById('keyMessage').textContent = content[lang].keyMessage;

        const audio = new Audio(`audio/level3-04-2-sigma-problem-${lang}.mp3`);
        let isPaused = false;
        let animationStartTime = null;

        function playVideo() {
            isPaused = false;
            audio.play().catch(err => console.log('Audio playback failed:', err));
            if (!animationStartTime) animationStartTime = Date.now();
        }

        function pauseVideo() {
            isPaused = true;
            audio.pause();
        }

        function restartVideo() {
            location.reload();
        }

        setTimeout(() => playVideo(), 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
    <div class="controls">
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="restartVideo()">🔄 Restart</button>
    </div>
</body>
</html>

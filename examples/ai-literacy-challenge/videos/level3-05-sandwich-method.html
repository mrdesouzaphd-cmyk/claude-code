<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich Method</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .sandwich {
            position: absolute;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            animation: sandwichFade 1s ease-out 3s forwards;
        }
        .layer {
            padding: 20px 30px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            opacity: 0;
            animation: layerSlide 0.5s ease-out forwards;
        }
        .layer.human {
            background: linear-gradient(135deg, #FFD700, #FF00FF);
            color: #fff;
        }
        .layer.ai {
            background: linear-gradient(135deg, #00D9FF, #FF00FF);
            color: #fff;
        }
        .layer:nth-child(1) { animation-delay: 3.5s; }
        .layer:nth-child(2) { animation-delay: 4.5s; }
        .layer:nth-child(3) { animation-delay: 5.5s; }
        .icon {
            font-size: 32px;
        }
        .arrows {
            position: absolute;
            left: -80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 30px 0;
        }
        .arrow {
            font-size: 32px;
            color: #FFD700;
            opacity: 0;
            animation: arrowPulse 1s ease-in-out infinite;
        }
        .arrow:nth-child(1) { animation-delay: 4s; }
        .arrow:nth-child(2) { animation-delay: 5s; }
        .key-message {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes sandwichFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes layerSlide {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title">SANDWICH METHOD</h1>
        <p class="subtitle">Método Sanduíche</p>
        <div class="sandwich">
            <div class="arrows">
                <div class="arrow">↓</div>
                <div class="arrow">↓</div>
            </div>
            <div class="layer human">
                <div class="icon">👤</div>
                <span>HUMAN GUIDES</span>
            </div>
            <div class="layer ai">
                <div class="icon">🤖</div>
                <span>AI PROCESSES</span>
            </div>
            <div class="layer human">
                <div class="icon">👤</div>
                <span>HUMAN VERIFIES</span>
            </div>
        </div>
        <p class="key-message">Human → AI → Human collaboration</p>
    </div>
    <script>
        // Narration texts
        const narration = {
            en: "The Sandwich Method: Human guides, AI processes, Human verifies - a collaborative workflow.",
            pt: "O Método Sanduíche: Humano guia, IA processa, Humano verifica - um fluxo colaborativo."
        };

        // Detect language from URL parameter (?lang=en or ?lang=pt, default to pt)
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        // Text-to-speech narration
        function speak() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(narration[lang]);
                utterance.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // Start narration after 500ms delay
        setTimeout(speak, 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }

        setTimeout(() => {
            location.reload();
        }, 8000);
    </script>
</body>
</html>

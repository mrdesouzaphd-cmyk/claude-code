<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich Method</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0033 0%, #000428 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .title {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #00D9FF, #FF00FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: titleFlyIn 1s ease-out 0s forwards;
        }
        .subtitle {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            opacity: 0;
            top: 60%;
            animation: subtitleFade 1s ease-out 2s forwards;
        }
        .sandwich {
            position: absolute;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            animation: sandwichFade 1s ease-out 3s forwards;
        }
        .layer {
            padding: 20px 30px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            opacity: 0;
            animation: layerSlide 0.5s ease-out forwards;
        }
        .layer.human {
            background: linear-gradient(135deg, #FFD700, #FF00FF);
            color: #fff;
        }
        .layer.ai {
            background: linear-gradient(135deg, #00D9FF, #FF00FF);
            color: #fff;
        }
        .layer:nth-child(1) { animation-delay: 3.5s; }
        .layer:nth-child(2) { animation-delay: 4.5s; }
        .layer:nth-child(3) { animation-delay: 5.5s; }
        .icon {
            font-size: 32px;
        }
        .arrows {
            position: absolute;
            left: -80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 30px 0;
        }
        .arrow {
            font-size: 32px;
            color: #FFD700;
            opacity: 0;
            animation: arrowPulse 1s ease-in-out infinite;
        }
        .arrow:nth-child(1) { animation-delay: 4s; }
        .arrow:nth-child(2) { animation-delay: 5s; }
        .key-message {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
            text-align: center;
            top: 75%;
            opacity: 0;
            animation: messageFade 1s ease-out 6s forwards;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 2s ease-out forwards;
        }
        @keyframes titleFlyIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes subtitleFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes sandwichFade {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes layerSlide {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes messageFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(var(--tx)); }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .controls button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .controls button:nth-child(1) {
            background: linear-gradient(135deg, #00D9FF, #0090BB);
            border-color: #00D9FF;
            color: white;
        }
        .controls button:nth-child(2) {
            background: linear-gradient(135deg, #FF00FF, #BB00BB);
            border-color: #FF00FF;
            color: white;
        }
        .controls button:nth-child(3) {
            background: linear-gradient(135deg, #FFD700, #BBA000);
            border-color: #FFD700;
            color: #1a0033;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        .controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="sandwich">
            <div class="arrows">
                <div class="arrow">↓</div>
                <div class="arrow">↓</div>
            </div>
            <div class="layer human">
                <div class="icon">👤</div>
                <span id="layer1"></span>
            </div>
            <div class="layer ai">
                <div class="icon">🤖</div>
                <span id="layer2"></span>
            </div>
            <div class="layer human">
                <div class="icon">👤</div>
                <span id="layer3"></span>
            </div>
        </div>
        <p class="key-message" id="keyMessage"></p>
    </div>
        <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'pt';

        const content = {
            en: {title: 'SANDWICH METHOD', subtitle: 'Structured Feedback', keyMessage: 'Positive - Improvement - Positive'},
            pt: {title: 'METODO SANDUICHE', subtitle: 'Feedback Estruturado', keyMessage: 'Positivo - Melhoria - Positivo'}
        };

        document.getElementById('title').textContent = content[lang].title;
        document.getElementById('subtitle').textContent = content[lang].subtitle;
        document.getElementById('keyMessage').textContent = content[lang].keyMessage;

        const audio = new Audio(`audio/level3-05-sandwich-method-${lang}.mp3`);
        let isPaused = false;
        let animationStartTime = null;

        function playVideo() {
            isPaused = false;
            audio.play().catch(err => console.log('Audio playback failed:', err));
            if (!animationStartTime) animationStartTime = Date.now();
        }

        function pauseVideo() {
            isPaused = true;
            audio.pause();
        }

        function restartVideo() {
            location.reload();
        }

        setTimeout(() => playVideo(), 500);

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + Math.random() * 20 + '%';
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
    <div class="controls">
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="restartVideo()">🔄 Restart</button>
    </div>
</body>
</html>
